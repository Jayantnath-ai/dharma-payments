<svg width="100%" viewBox="0 0 680 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dharma Payments component flow">
<title>Dharma Payments component flow</title>
<desc>An agent proposes a payment. The Viveka Gate decides to execute, probe, or escalate. Escalations go to the Pause Engine. All resolved outcomes feed the Adhikara Ledger, which recalibrates the gate.</desc>
<style>
.t{font:14px system-ui,-apple-system,sans-serif;fill:#16232E}
.ts{font:12px system-ui,-apple-system,sans-serif;fill:#5A6B78}
.th{font:500 14px system-ui,-apple-system,sans-serif;fill:#16232E}
.arr{stroke:#5A6B78;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5A6B78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="250" y="30" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="57" text-anchor="middle">Agent proposes payment</text>
<line x1="340" y1="74" x2="340" y2="112" class="arr" marker-end="url(#a)"/>

<rect x="230" y="114" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="137" text-anchor="middle" fill="#0C447C">Viveka Gate</text>
<text class="ts" x="340" y="156" text-anchor="middle" fill="#185FA5">Can this be undone?</text>

<path d="M340 170 V196 H135 V212" class="arr" marker-end="url(#a)"/>
<path d="M340 170 V212" class="arr" marker-end="url(#a)"/>
<path d="M340 170 V196 H545 V212" class="arr" marker-end="url(#a)"/>

<rect x="50" y="214" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="135" y="237" text-anchor="middle" fill="#085041">Execute</text>
<text class="ts" x="135" y="256" text-anchor="middle" fill="#0F6E56">Money moves</text>

<rect x="255" y="214" width="170" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="237" text-anchor="middle" fill="#633806">Probe</text>
<text class="ts" x="340" y="256" text-anchor="middle" fill="#854F0B">Small test first</text>

<rect x="460" y="214" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="545" y="237" text-anchor="middle" fill="#712B13">Escalate</text>
<text class="ts" x="545" y="256" text-anchor="middle" fill="#993C1D">Needs a human</text>

<line x1="545" y1="270" x2="545" y2="308" class="arr" marker-end="url(#a)"/>

<rect x="450" y="310" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="545" y="333" text-anchor="middle" fill="#712B13">Pause Engine</text>
<text class="ts" x="545" y="352" text-anchor="middle" fill="#993C1D">Which reviews matter</text>

<path d="M135 270 V400 H340 V418" class="arr" marker-end="url(#a)"/>
<path d="M545 366 V400 H340 V418" class="arr" marker-end="url(#a)"/>
<path d="M340 270 V418" class="arr" marker-end="url(#a)"/>

<rect x="200" y="420" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="443" text-anchor="middle" fill="#3C3489">Adhikara Ledger</text>
<text class="ts" x="340" y="462" text-anchor="middle" fill="#534AB7">Who earned discretion</text>

<path d="M200 448 H26 V142 H222" class="arr" marker-end="url(#a)"/>
<text class="ts" x="120" y="492" text-anchor="middle">Outcomes recalibrate the gate</text>
</svg>
