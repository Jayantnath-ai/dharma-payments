<svg width="100%" viewBox="0 0 680 570" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inside the Pause Engine">
<title>Inside the Pause Engine</title>
<desc>An escalated payment is checked for worthiness, given prefilled evidence, ranked in a triage queue, then resolved either by human review or by a timeout default. Every disposition feeds the Adhikara Ledger.</desc>
<style>
.ts{font:12px system-ui,-apple-system,sans-serif;fill:#5A6B78}
.th{font:500 14px system-ui,-apple-system,sans-serif;fill:#16232E}
.arr{stroke:#5A6B78;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5A6B78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="250" y="26" width="180" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="53" text-anchor="middle" fill="#0C447C">Escalated payment</text>
<line x1="340" y1="70" x2="340" y2="98" class="arr" marker-end="url(#a)"/>

<rect x="240" y="100" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="123" text-anchor="middle" fill="#0C447C">Worthiness check</text>
<text class="ts" x="340" y="142" text-anchor="middle" fill="#185FA5">Stake vs cost of looking</text>

<path d="M340 156 V176 H125 V194" class="arr" marker-end="url(#a)"/>
<path d="M340 156 V194" class="arr" marker-end="url(#a)"/>

<rect x="40" y="196" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="125" y="219" text-anchor="middle" fill="#2C2C2A">Auto-resolve</text>
<text class="ts" x="125" y="238" text-anchor="middle" fill="#5F5E5A">Not worth looking</text>

<rect x="245" y="196" width="190" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="219" text-anchor="middle" fill="#0C447C">Prefill evidence</text>
<text class="ts" x="340" y="238" text-anchor="middle" fill="#185FA5">12 min becomes 4</text>

<line x1="340" y1="252" x2="340" y2="290" class="arr" marker-end="url(#a)"/>

<rect x="235" y="292" width="210" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="340" y="315" text-anchor="middle" fill="#0C447C">Triage queue</text>
<text class="ts" x="340" y="334" text-anchor="middle" fill="#185FA5">Rank by what changes</text>

<path d="M340 348 V366 H260 V384" class="arr" marker-end="url(#a)"/>
<path d="M340 348 V366 H470 V384" class="arr" marker-end="url(#a)"/>

<rect x="175" y="386" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="260" y="409" text-anchor="middle" fill="#085041">Human reviews</text>
<text class="ts" x="260" y="428" text-anchor="middle" fill="#0F6E56">Approve or reject</text>

<rect x="385" y="386" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="470" y="409" text-anchor="middle" fill="#2C2C2A">Timeout default</text>
<text class="ts" x="470" y="428" text-anchor="middle" fill="#5F5E5A">Release or hold</text>

<path d="M125 252 V460 H340 V478" class="arr" marker-end="url(#a)"/>
<path d="M260 442 V460 H340 V478" class="arr" marker-end="url(#a)"/>
<path d="M470 442 V460 H340 V478" class="arr" marker-end="url(#a)"/>

<rect x="200" y="480" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="503" text-anchor="middle" fill="#3C3489">Adhikara Ledger</text>
<text class="ts" x="340" y="522" text-anchor="middle" fill="#534AB7">Every outcome is a label</text>
</svg>
